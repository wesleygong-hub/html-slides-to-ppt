<!doctype html>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  .viewport { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; }
  .scaler { width: 1280px; height: 720px; transform-origin: center; }
  .track { display: flex; width: 2560px; height: 720px; }
  .slide { width: 1280px; height: 720px; flex: 0 0 auto; display: flex; flex-direction: column; padding: 40px; background: #f4f5f8; }
  h1 { margin: 0; font: 900 31px/1.34 'Noto Serif SC', serif; }
  h1 span { color: #c33a2b; }
  .card { position: relative; margin-top: 20px; padding: 20px; background: #122838; border-radius: 6px; color: white; overflow: hidden; }
  .card::before { content: ''; position: absolute; width: 220px; height: 220px; right: -40px; top: -60px; border-radius: 50%; background: radial-gradient(circle, rgba(224,85,69,.22), transparent 70%); }
  p { margin: 0; font: 400 12.5px/1.66 'Noto Sans SC', sans-serif; }
  .label { position: relative; display: flex; align-items: center; gap: 10px; font: 14px 'Noto Sans SC'; background: transparent; margin: 10px 0; }
  .label::after { content: ''; height: 1px; flex: 1; background: linear-gradient(90deg,#e1e5eb,transparent); }
  li { display: flex; gap: 6px; font: 12px 'Noto Sans SC'; }
  li::before { content: '·'; color: #e05545; }
  .external-controls { position: fixed; bottom: 10px; left: 600px; background: red; }
  .noise { position: fixed; inset: 0; pointer-events: none; }
</style>
<div class="viewport"><div class="scaler"><div class="track">
  <section class="slide"><h1>专业服务<span>保真转换</span>案例</h1><div class="card"><p><b>保留强调</b>和普通正文，不遗漏内容</p></div><div class="label">分节标题</div><ul><li>列表项</li></ul><div data-html2ppt-ignore>不应导出</div></section>
  <section class="slide"><h1>第二页</h1><p>完整页面</p></section>
</div></div></div>
<div class="noise"></div><nav class="external-controls">上一页 01/02 下一页</nav>
<script>
  function fit() { document.querySelector('.scaler').style.transform = `scale(${Math.min(innerWidth/1280,innerHeight/720)})`; }
  fit(); addEventListener('resize', fit);
</script>
